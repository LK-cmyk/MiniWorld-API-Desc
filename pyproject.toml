[project]
name = "miniworld-api-desc"
version = "0.7.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "loguru>=0.7.3",
    "click>=8.5.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools", "tools.*"]
exclude = ["addon*", "declarations*", "docs*", "img*", "out*", "server*"]
namespaces = false

[tool.black]
line-length = 140
